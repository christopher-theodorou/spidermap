<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex spidermap.php
    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AllowOverride None
        AuthType Basic
        AuthName "SpiderMap"
        AuthBasicProvider file
        AuthUserFile /run/spidermap-auth/users.htpasswd
        Require valid-user
    </Directory>
    <FilesMatch "\.(json|env|py|log|bak)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
