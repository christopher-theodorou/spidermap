<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpiderMap</title>
<link rel="icon" type="image/svg+xml" href="spidermap-assets/spidermap-favicon.svg">
<link rel="stylesheet" href="spidermap-assets/tabler-icons.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css'">
<style>
:root{--pur:#8b5cf6;--pur-bg:#efe9fe;--bg:#f6f7f9;--card:#fff;--text:#1d2433;--muted:#6b7385;--faint:#a3a9b6;--border:#e3e6ec;--accent:#4f5bd5;--accent-bg:#eceefc;--ok:#22a55b;--ok-bg:#e3f6ec;--warn:#e8950f;--warn-bg:#fdf1dc;--bad:#e5484d;--bad-bg:#fde8e8;--off:#b8bec9;--line:#a9b0ec;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171c;--card:#1d2128;--text:#e7eaf0;--muted:#9aa3b2;--faint:#646d7c;--border:#2c323c;--accent:#7c86f0;--accent-bg:#22264a;--ok-bg:#16301f;--warn-bg:#382a10;--bad-bg:#3a1a1b;--off:#4b525e;--line:#3f4794;--pur-bg:#2a2045;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--pur-bg:#2a2045;--bg:#14171c;--card:#1d2128;--text:#e7eaf0;--muted:#9aa3b2;--faint:#646d7c;--border:#2c323c;--accent:#7c86f0;--accent-bg:#22264a;--ok-bg:#16301f;--warn-bg:#382a10;--bad-bg:#3a1a1b;--off:#4b525e;--line:#3f4794;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card)}
header h1{font-size:17px;font-weight:800;margin:0 6px 0 0;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
header h1 b{font-weight:800}header h1 span{color:var(--accent)}
header h1 img{width:30px;height:30px}
.lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lg-l{display:none}:root:not([data-theme=light]) .lg-d{display:inline}}
:root[data-theme=dark] .lg-l{display:none}:root[data-theme=dark] .lg-d{display:inline}
.stat{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sp{flex:1}
.search{height:30px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:0 10px;width:200px;font:inherit}
.btn{height:30px;min-width:30px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font:inherit;text-decoration:none}
.fld{display:block;margin:8px 0}.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fld input[type=number],.fld input[type=text],.fld select,.fld textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.fld textarea{font-family:ui-monospace,monospace;resize:vertical}.fld small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.fld.chk{display:flex;gap:8px;align-items:center}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.note{font-size:12px;margin:4px 0}
#s-time{cursor:pointer}.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}
/* settings dialog - design from the "SpiderMap v0.5.0 - Settings" artifact */
:root{--sm-accent:#5b2bd6;--sm-accent-h:#4a1fbd;--sm-soft:#efe9fe;--sm-text:#4a1fbd}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--sm-accent:#8a63ff;--sm-accent-h:#9d7bff;--sm-soft:#2a2045;--sm-text:#b9a3ff}}
:root[data-theme=dark]{--sm-accent:#8a63ff;--sm-accent-h:#9d7bff;--sm-soft:#2a2045;--sm-text:#b9a3ff}
.sm-back{position:fixed;inset:0;background:rgba(10,10,40,.38);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60}
.sm-back[hidden]{display:none}
.sm{background:var(--card);color:var(--text);border-radius:14px;box-shadow:0 24px 60px rgba(10,10,40,.28);width:min(1120px,100%);height:min(780px,100%);display:flex;flex-direction:column;overflow:hidden}
.sm-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
.sm-head h2{margin:0;font-size:20px;font-weight:700}.sm-head .ti-topology-star-3{font-size:28px;color:var(--sm-accent)}
.sm-badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--sm-soft);color:var(--sm-text)}
.sm-badge.ver{background:transparent;color:var(--muted);border:1px solid var(--border)}.sm-badge.new{background:var(--ok-bg);color:var(--ok)}
.sm-x{margin-left:auto;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;width:36px;height:36px;border-radius:8px}.sm-x:hover{background:var(--bg)}
.sm-body{flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0}
.sm-tabs{border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.sm-tab{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:0;background:none;cursor:pointer;font:inherit;font-size:14.5px;color:var(--text);text-align:left;position:relative}
.sm-tab:hover{background:var(--bg)}.sm-tab i{font-size:18px;color:var(--muted)}
.sm-tab[aria-selected=true]{background:var(--sm-soft);color:var(--sm-text);font-weight:600}.sm-tab[aria-selected=true] i{color:var(--sm-text)}
.sm-tab[aria-selected=true]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--sm-accent)}
.sm-tab .chg{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--sm-accent);display:none}.sm-tab.dirty .chg{display:block}
.sm-main{overflow-y:auto;padding:20px 26px 26px}
.sm-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.sm-main h3{margin:0 0 12px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.sm-main h4{margin:20px 0 6px;font-size:13.5px;font-weight:700;color:var(--sm-text)}
.sm-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,250px);align-items:center;gap:14px;padding:6px 0}
.sm-row.sw{grid-template-columns:1fr auto;padding:7px 0}.sm-row.dis{opacity:.55}
.sm-row label,.sm-row .lb{display:flex;align-items:center;gap:7px;font-size:14px}
.sm-sep{border-top:1px solid var(--border);margin:10px 0}
.sm-err{grid-column:2;color:var(--bad);font-size:12px;margin-top:-4px}
.sm-field,.sm-sel{height:36px;width:100%;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);padding:0 11px;font:inherit;font-size:14px;outline:none}
.sm-field:focus,.sm-sel:focus{border-color:var(--sm-accent);box-shadow:0 0 0 3px var(--sm-soft)}.sm-field.bad,.sm-chips.bad{border-color:var(--bad)}
.sm-unit{position:relative}.sm-unit .sm-field{padding-right:58px}.sm-unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.sm-step{display:flex}.sm-step .sm-field{border-radius:7px 0 0 7px}.sm-step div{display:flex;flex-direction:column;border:1px solid var(--border);border-left:0;border-radius:0 7px 7px 0;overflow:hidden}
.sm-step button{border:0;background:var(--card);color:var(--muted);height:17px;width:28px;cursor:pointer;font-size:9px}.sm-step button:hover{background:var(--bg)}
.sm-switch{position:relative;width:44px;height:26px;flex:none}.sm-switch input{opacity:0;width:0;height:0}
.sm-switch span{position:absolute;inset:0;background:var(--border);border-radius:13px;transition:.15s;cursor:pointer}
.sm-switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sm-switch input:checked+span{background:var(--sm-accent)}.sm-switch input:checked+span::after{transform:translateX(18px)}
.sm-switch input:disabled+span{cursor:not-allowed;opacity:.6}.sm-switch input:focus-visible+span{box-shadow:0 0 0 3px var(--sm-soft)}
.sm-info{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:10.5px;font-weight:700;cursor:help;flex:none}
.sm-info .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:250px;background:var(--text);color:var(--card);font-weight:400;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:7px;opacity:0;pointer-events:none;transition:.12s;z-index:5}
.sm-info:hover .tip,.sm-info:focus .tip{opacity:1}
.sm-chips{min-height:40px;border:1px solid var(--border);border-radius:7px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--card)}
.sm-chips:focus-within{border-color:var(--sm-accent);box-shadow:0 0 0 3px var(--sm-soft)}
.sm-chip{display:inline-flex;align-items:center;gap:5px;background:var(--sm-soft);color:var(--sm-text);border-radius:6px;padding:3px 5px 3px 9px;font-size:13px;font-family:ui-monospace,monospace}
.sm-chip button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0 3px;border-radius:4px}
.sm-chips input{border:0;outline:0;flex:1;min-width:100px;background:none;height:28px;padding:0 4px;color:var(--text);font:inherit;font-size:13.5px}
.sm-mini{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ok-bg);color:var(--ok);margin-left:6px}
.sm-note{display:flex;gap:10px;background:var(--sm-soft);border-radius:8px;padding:11px 14px;margin-top:18px;font-size:13.5px;line-height:1.45}
.sm-note i{color:var(--sm-text);font-size:18px}.sm-note a{color:var(--sm-text);cursor:pointer}
.sm-card{border:1px solid var(--border);border-radius:12px;padding:16px}
.sm-card h4{margin:0 0 12px;font-size:16px;color:var(--text);display:flex;align-items:center;gap:8px}
.sm-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;font-size:13.5px;background:var(--ok-bg);color:var(--ok)}
.sm-pill.bad{background:var(--bad-bg);color:var(--bad)}.sm-pill.warn{background:var(--warn-bg);color:var(--warn)}
.sm-kv{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}.sm-kv i{color:var(--muted)}.sm-kv b{margin-left:auto}
.sm-bar{height:7px;border-radius:4px;background:var(--bg);border:1px solid var(--border);overflow:hidden;flex:1}.sm-bar div{height:100%;background:var(--sm-accent);transition:width .4s}
.sm-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:40px;width:100%;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer;margin-top:10px}
.sm-btn:hover{background:var(--bg)}.sm-btn.primary{background:var(--sm-accent);border-color:var(--sm-accent);color:#fff;font-weight:600}.sm-btn.primary:hover{background:var(--sm-accent-h)}
.sm-btn:disabled{opacity:.5;cursor:not-allowed}
.sm-foot{display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--border)}
.sm-foot #sm-state{margin-right:auto;font-size:13.5px;color:var(--muted);max-height:60px;overflow:auto}.sm-foot .sm-btn{width:auto;padding:0 22px;margin:0}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sm-cat{border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:12.5px;color:var(--muted);opacity:.75}.sm-cat b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
.sm-dt{border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:12.5px;color:var(--muted)}
.sm-dt.is-off{opacity:.55}.sm-dt-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}.sm-dt-h i{font-size:19px;color:var(--sm-text)}
.sm-dt-h b{color:var(--text);font-size:13.5px;flex:1}.sm-dt .det{margin-top:5px}.sm-dt .nr{margin-top:6px;font-weight:600;color:var(--text)}
.sm-log{border:1px solid var(--border);border-radius:8px;font-size:12.5px}.sm-log div{display:grid;grid-template-columns:110px 60px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border)}.sm-log div:last-child{border:0}
@media (max-width:760px){.sm-back{padding:0}.sm{border-radius:0;height:100%}.sm-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.sm-tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.sm-tab{white-space:nowrap;padding:7px 11px}.sm-tab[aria-selected=true]::before{display:none}
.sm-cols{grid-template-columns:1fr}.sm-row{grid-template-columns:1fr}.sm-err{grid-column:1}}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;border-color:var(--border);color:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn i{font-size:16px}
#canvas{position:absolute;top:var(--hh,51px);left:0;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none}
#canvas.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage.anim{transition:transform .35s ease}
.tn{position:absolute;width:104px;text-align:center;cursor:pointer;transition:left .35s ease,top .35s ease,opacity .3s}
.tn .ic{position:relative;width:48px;height:48px;margin:0 auto;border-radius:14px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tn .ic img{width:28px;height:28px}
.tn:hover .ic{transform:translateY(-2px);border-color:var(--accent)}
.tn.sel .ic{border:2px solid var(--accent);color:var(--accent)}
.tn.match .ic{outline:3px solid var(--warn);outline-offset:2px}
.tn .st{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card)}
.tn .nm{font-size:12px;font-weight:500;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .sb{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn.off .ic{opacity:.55}.tn.off .nm{color:var(--faint)}
.tn.down .ic{border-color:var(--bad);color:var(--bad)}
.tn.new .ic{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,91,213,.5)}50%{box-shadow:0 0 0 7px rgba(79,91,213,0)}}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:0 6px;border-radius:999px;margin:2px 1px 0}
.t-new,.t-unknown{background:var(--accent-bg);color:var(--accent)}
.t-moved,.t-ip{background:var(--warn-bg);color:var(--warn)}
.t-down{background:var(--bad-bg);color:var(--bad)}
.tg{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;line-height:19px;text-align:center;cursor:pointer;user-select:none;transition:left .35s,top .35s;box-shadow:0 0 0 3px var(--bg)}
.cnt{position:absolute;font-size:11px;color:var(--muted);transition:left .35s,top .35s}
.pt{position:absolute;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--accent);background:var(--card);white-space:nowrap;transform:translateX(-50%);transition:left .35s,top .35s}
svg line{transition:stroke .2s}
.ln{stroke:var(--line);stroke-width:1.5}
.ln.off{stroke:var(--off);stroke-dasharray:4 4}
#vlan-pop{position:fixed;z-index:40;width:280px;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(10,10,40,.18);padding:10px 12px;font-size:13px}
.vl-row{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer}.vl-row .vl-c{margin-left:auto;color:var(--muted);font-size:12px}
.ln.lw{stroke:var(--warn)}.ln.lc{stroke:var(--bad)}
body.free .tn{cursor:grab}body.free .tn:active{cursor:grabbing}
.tn.prob .ic{box-shadow:0 0 0 3px var(--pc)}.tn.inferred .ic{border:2px dashed var(--muted)}
.pl-row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.pl-row i{width:10px;height:10px;border-radius:2px;display:block}
/* ---------- themes: each one light and dark (dark rules are more specific, so they win in dark mode) ---------- */
#skin-pop{position:fixed;z-index:40;width:220px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(10,10,40,.18);padding:8px;font-size:13px}
#skin-pop button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--text);padding:7px 8px;border-radius:7px;cursor:pointer;font:inherit;text-align:left}
#skin-pop button:hover{background:var(--bg)}#skin-pop .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--border)}#skin-pop .on{font-weight:600}
#skin-pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
/* ---------- overview dashboard ---------- */
#viewsw{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
#viewsw button{border:0;background:var(--card);color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
#viewsw button[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);font-weight:600}
#dash{display:none;position:absolute;top:var(--hh,51px);left:0;right:0;bottom:0;overflow:auto;padding:18px 20px 30px;background:var(--bg);z-index:5}
body.dash #dash{display:block}body.dash #canvas,body.dash #gw,body.dash #mapctl{visibility:hidden}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1500px;margin:0 auto}
.db-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.db-card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.04em}
.db-card h3 i{font-size:16px;color:var(--accent)}
.db-big{font-size:30px;font-weight:700;line-height:1.1}.db-sub{color:var(--muted);font-size:12.5px}
.db-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.db-kpi{background:var(--bg);border-radius:8px;padding:8px 10px}.db-kpi b{display:block;font-size:19px}.db-kpi span{font-size:12px;color:var(--muted)}
.db-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}.db-row:last-child{border:0}
.db-row .r{margin-left:auto;color:var(--muted);white-space:nowrap}.db-row a{color:var(--text);cursor:pointer;text-decoration:none}.db-row a:hover{color:var(--accent)}
.db-types{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.db-types span{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12.5px}
.db-bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;flex:1;max-width:120px}.db-bar div{height:100%;background:var(--accent)}
#inv{display:none;position:absolute;top:var(--hh,51px);left:0;right:0;bottom:0;overflow:auto;padding:18px 20px 30px;background:var(--bg);z-index:5}
body.inv #inv{display:block}body.inv #canvas,body.inv #gw,body.inv #mapctl{visibility:hidden}
.inv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.inv-top input{height:32px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);padding:0 10px;min-width:220px;font:inherit}
.inv-n{color:var(--muted);font-size:12.5px;margin-right:auto}
.inv-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:12px}

/* ---------- style packs: the spiders (colours, node shape, direction) ---------- */

@media (prefers-color-scheme:dark){:root[data-skin=green]:not([data-theme=light]){--bg:#0f1512;--card:#17201b;--text:#e2efe6;--muted:#93a89a;--border:#26332c;--accent:#4cc56f;--accent-bg:#173322;--line:#2f6b43;--pur:#3fbf9b;--pur-bg:#123029;--sm-accent:#4cc56f;--sm-accent-h:#6bd489;--sm-soft:#173322;--sm-text:#7fdc98}}
:root[data-skin=green][data-theme=dark]{--bg:#0f1512;--card:#17201b;--text:#e2efe6;--muted:#93a89a;--border:#26332c;--accent:#4cc56f;--accent-bg:#173322;--line:#2f6b43;--pur:#3fbf9b;--pur-bg:#123029;--sm-accent:#4cc56f;--sm-accent-h:#6bd489;--sm-soft:#173322;--sm-text:#7fdc98}
:root[data-skin=blue]{--bg:#f2f6fb;--card:#fff;--text:#122033;--muted:#5b6b80;--border:#dbe4ef;--accent:#1677d2;--accent-bg:#e1eefb;--line:#90bde9;--pur:#0f9bd7;--pur-bg:#dff2fb;--sm-accent:#1677d2;--sm-accent-h:#1266b4;--sm-soft:#e1eefb;--sm-text:#1266b4}
@media (prefers-color-scheme:dark){:root[data-skin=blue]:not([data-theme=light]){--bg:#0d1420;--card:#152031;--text:#e3ecf7;--muted:#90a3ba;--border:#22324a;--accent:#4aa3f0;--accent-bg:#14304f;--line:#2b5c8f;--pur:#38bdf8;--pur-bg:#0c3049;--sm-accent:#4aa3f0;--sm-accent-h:#72b8f4;--sm-soft:#14304f;--sm-text:#8cc6f6}}
:root[data-skin=blue][data-theme=dark]{--bg:#0d1420;--card:#152031;--text:#e3ecf7;--muted:#90a3ba;--border:#22324a;--accent:#4aa3f0;--accent-bg:#14304f;--line:#2b5c8f;--pur:#38bdf8;--pur-bg:#0c3049;--sm-accent:#4aa3f0;--sm-accent-h:#72b8f4;--sm-soft:#14304f;--sm-text:#8cc6f6}
:root[data-skin=red]{--bg:#f7f3f3;--card:#fff;--text:#231515;--muted:#76605f;--border:#ecdcdc;--accent:#d7262e;--accent-bg:#fbe3e4;--line:#e79a9d;--pur:#b4232a;--pur-bg:#f9e0e1;--sm-accent:#d7262e;--sm-accent-h:#b81f26;--sm-soft:#fbe3e4;--sm-text:#b81f26}
@media (prefers-color-scheme:dark){:root[data-skin=red]:not([data-theme=light]){--bg:#0d0b0c;--card:#171213;--text:#f1e3e3;--muted:#a88f8f;--faint:#6b5858;--border:#2d2122;--accent:#f0444b;--accent-bg:#3a1517;--line:#7a2a2e;--pur:#ff6b6b;--pur-bg:#3a1517;--off:#4d3d3e;--sm-accent:#f0444b;--sm-accent-h:#f5696f;--sm-soft:#3a1517;--sm-text:#ff8a8f}}
:root[data-skin=red][data-theme=dark]{--bg:#0d0b0c;--card:#171213;--text:#f1e3e3;--muted:#a88f8f;--faint:#6b5858;--border:#2d2122;--accent:#f0444b;--accent-bg:#3a1517;--line:#7a2a2e;--pur:#ff6b6b;--pur-bg:#3a1517;--off:#4d3d3e;--sm-accent:#f0444b;--sm-accent-h:#f5696f;--sm-soft:#3a1517;--sm-text:#ff8a8f}
/* node shapes: green = device cards, blue = tiles, red = hexagons */
:root[data-skin=green] .tn{background:color-mix(in srgb,var(--accent-bg) 55%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:9px;padding:6px 4px 6px;box-shadow:none}
:root[data-skin=green] .tn .ic{border-radius:7px;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border))}

/* lines: each spider its own (special lines - offline, guessed, redundant, load, fibre - keep their meaning) */

:root[data-skin=green] .ln:not(.off):not(.lw):not(.lc):not(.fib):not(.redundant){stroke:color-mix(in srgb,var(--accent) 70%,var(--line))}
:root[data-skin=blue] .ln{stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-skin=blue] .ln:not(.off):not(.lw):not(.lc):not(.fib):not(.redundant){stroke:color-mix(in srgb,var(--accent) 45%,var(--line))}
:root[data-skin=red] .ln{stroke-width:1.5}
:root[data-skin=red] .ln:not(.off):not(.lw):not(.lc):not(.fib):not(.redundant){stroke:var(--accent)}
:root[data-skin=red] #stage>svg{filter:drop-shadow(0 0 2.5px color-mix(in srgb,var(--accent) 55%,transparent))}
:root[data-skin=blue] .tn .ic{border-radius:14px;width:52px;height:52px;background:var(--accent-bg);border:0;box-shadow:0 2px 6px rgba(22,119,210,.18)}
:root[data-skin=blue] .tn .ic i{font-size:26px;color:var(--accent)}
:root[data-skin=red] .tn .ic{border:0;border-radius:0;background:var(--accent-bg);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
:root[data-skin=red] .tn .ic i{color:var(--accent)}
:root[data-skin=red] .tn.down .ic{background:var(--accent);animation:redpulse 2s ease-in-out infinite}
:root[data-skin=red] .tn.down .ic i{color:#fff}
@keyframes redpulse{50%{filter:brightness(1.35)}}
/* the spiderweb (an easter egg): the green, blue and red spiders, and the default theme on Halloween */
#web{position:absolute;left:0;bottom:0;width:170px;height:170px;pointer-events:none;z-index:1;opacity:.55;display:none}
:root[data-skin=green] #web,:root[data-skin=blue] #web,:root[data-skin=red] #web,:root.halloween #web{display:block}
#web .silk{stroke:var(--muted);stroke-width:1;fill:none;opacity:.55}
#web .spider{pointer-events:auto;cursor:pointer}

#web .thread{stroke:var(--muted);stroke-width:1}

/* device drawings: green = drawn devices, blue = outlines, red = solid silhouettes */
.tn .ic svg.di{width:32px;height:32px;overflow:visible}
.tn .ic svg.di .b,.tn .ic svg.di .d{stroke-linecap:round;stroke-linejoin:round}
:root[data-skin=green] svg.di .b{fill:#eef1ef;stroke:#56645c;stroke-width:1.6}
:root[data-skin=green] svg.di .d{fill:none;stroke:#56645c;stroke-width:1.4}
:root[data-skin=green] svg.di .a{fill:var(--accent)}
@media (prefers-color-scheme:dark){:root[data-skin=green]:not([data-theme=light]) svg.di .b{fill:#26332c;stroke:#a7bcae}:root[data-skin=green]:not([data-theme=light]) svg.di .d{stroke:#a7bcae}}
:root[data-skin=green][data-theme=dark] svg.di .b{fill:#26332c;stroke:#a7bcae}:root[data-skin=green][data-theme=dark] svg.di .d{stroke:#a7bcae}
:root[data-skin=blue] svg.di .b{fill:none;stroke:var(--accent);stroke-width:2.6}
:root[data-skin=blue] svg.di .d{fill:none;stroke:var(--accent);stroke-width:2}
:root[data-skin=blue] svg.di .a{fill:var(--accent)}
:root[data-skin=red] svg.di .b{fill:var(--accent);stroke:var(--accent);stroke-width:1}
:root[data-skin=red] svg.di .d{fill:none;stroke:var(--card);stroke-width:1.6}
:root[data-skin=red] svg.di .a{fill:var(--card)}
:root[data-skin=red] .tn .ic svg.di{width:28px;height:28px}
:root[data-skin=red] .tn.down .ic svg.di .b{fill:#fff;stroke:#fff}:root[data-skin=red] .tn.down .ic svg.di .d{stroke:var(--accent)}:root[data-skin=red] .tn.down .ic svg.di .a{fill:var(--accent)}
.tn.off .ic svg.di{opacity:.55}
/* dragging the map is not selecting text, and icons are not images to drag away */
#canvas,#canvas *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
#canvas{cursor:grab}#canvas.drag{cursor:grabbing}
.ln.lag{stroke-width:4.5}.ln.redundant{stroke:var(--muted);stroke-dasharray:9 6;stroke-width:1.5}.ln.guess{stroke-dasharray:2 4;stroke-linecap:round}
.tag.t-stale{background:var(--bg);color:var(--muted);border:1px dashed var(--border)}.ln.fib{stroke:var(--pur);stroke-dasharray:7 3}.ln.fib.off{stroke:var(--off)}
#mapctl{position:absolute;right:16px;top:12px;max-height:calc(100% - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:6;transition:right .25s}
#mapctl button{width:34px;height:34px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:17px;cursor:pointer;display:grid;place-items:center}
#mapctl button:hover{background:var(--bg);color:var(--accent)}#mapctl button:focus-visible{outline:2px solid var(--accent)}
#mapctl .sep{height:1px;background:var(--border);margin:3px 4px}
body.panel-open #mapctl{right:406px}
@media (max-width:700px){body.panel-open #mapctl{right:16px}#mapctl{top:10px;right:10px}}
/* a short window (e.g. a Zabbix dashboard widget): the controls become one row along the top */
@media (max-height:560px){#mapctl{flex-direction:row;max-height:none;max-width:calc(100% - 24px);overflow-x:auto;overflow-y:hidden}#mapctl .sep{width:1px;height:auto;margin:4px 3px}}
.ln.hl{stroke:var(--accent);stroke-width:2.5}
.fl{stroke:var(--ok);stroke-width:2.2;stroke-dasharray:3 9;animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.fl,.tn.new .ic{animation:none}}
aside{position:absolute;top:var(--hh,51px);right:0;bottom:0;width:390px;max-width:100%;background:var(--card);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;padding:16px 18px;z-index:5}
aside.open{transform:none}
aside h2{font-size:16px;margin:0;font-weight:600}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}

.x{margin-left:auto}
table{width:100%;border-collapse:collapse}
.kv td{padding:5px 0;border-bottom:1px solid var(--border);vertical-align:top}

.lst td:first-child,.lst td:nth-child(3){white-space:nowrap}
.lst tr.h td{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.lst tr.r{cursor:pointer}.lst tr.r:hover td{background:var(--bg)}
.lst tr.on td{background:var(--accent-bg)}
.sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.front{display:inline-flex;flex-direction:column;gap:5px;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
.front div{display:flex;gap:5px}
.port{width:30px;height:24px;border-radius:5px;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--faint)}
.port.up,.port.s1g{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

.port.s25g{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}

.spd{display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:11px;color:var(--muted)}

.gr.isp{cursor:pointer}.gr.isp span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}

.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.25}}
.st-big{display:flex;gap:16px;align-items:baseline;margin:6px 0 2px}
.st-big b{font-size:20px;font-weight:600}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wide{width:100%;justify-content:center;margin-top:10px;border-color:var(--accent);color:var(--accent)}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;margin:3px 0 8px}
.bar div{height:100%;border-radius:4px}
.srow{display:flex;justify-content:space-between;font-size:12px}
.srow span:first-child{color:var(--muted)}
.lgd{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.lgd i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}

.ef .ck{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--text);font-size:13px}
.ef .msg{font-size:12px;margin-top:8px}
.tb{position:relative}
.tb .bd{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.evd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px}
.evr{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border);align-items:flex-start}
.evr.go{cursor:pointer}.evr.go:hover{background:var(--bg)}
.evr i{font-size:17px;margin-top:1px}
.evr .tx{flex:1}
.evr .tm{color:var(--faint);font-size:11px;white-space:nowrap}
.pres{display:block;width:100%;height:10px;border-radius:3px;margin:3px 0}
.prow{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-left:40px}
.pp{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}

.ttr{padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer}

.t-cable,.t-traffic{background:var(--warn-bg);color:var(--warn)}
.t-conflict{background:var(--bad-bg);color:var(--bad)}

.frontwrap{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

#auth{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.ab-box{max-width:380px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 26px;box-shadow:var(--shadow)}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:.92}
.tile small{display:block;font-size:10px;color:var(--faint)}
@media (max-width:700px){#gw{display:none}aside{top:auto;height:60%;width:100%;border-left:0;border-top:1px solid var(--border);transform:translateY(100%)}.search{width:130px}.legend{display:none}}
</style>

<body>
<header>
  <h1 title="SpiderMap · Nothing touches the web unnoticed."><img src="spidermap-assets/spidermap-favicon.svg" alt=""><b>Spider<span>Map</span></b><span id="map-name" style="font-weight:500;color:var(--muted);margin-left:6px;font-size:.8em"></span></h1>
  <span class="stat" id="s-on"></span><span class="stat" id="s-off"></span><span class="stat" id="s-new"></span>
  <span class="stat legend">
    <span><i class="dot" style="background:var(--ok)"></i> online</span>
    <span><i class="dot" style="background:var(--off)"></i> off / asleep</span>
    <span><i class="dot" style="background:var(--accent)"></i> new / unknown</span>
    <span title="A link SpiderMap could not see directly: only through the gateway, behind another device, or where the device was last seen"><svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/></svg> guessed link</span>
    <span><i class="dot" style="background:var(--warn)"></i> changed</span>

<script>
"use strict";
const PAGE_VERSION = "0.9.4";
const COL = 108, ROW = 150;

/* ---------- data access: everything goes through spidermap.php (Zabbix login required) ---------- */
const API = "spidermap.php";
let authMsg = "";
async function getData(name) {

let ME = { can: { edit: true, speedtest: true }, need: {} };
const ROLE = { 1: "Zabbix users", 2: "Zabbix admins", 3: "Zabbix Super admins" };

/* ---------- theme ---------- */
const themes = ["auto", "light", "dark"];
function applyTheme(t) { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); $("#theme").title = "Theme: " + t; }
let theme = store("nm-theme") || "auto"; applyTheme(theme);
// the theme button opens the menu with the themes and light / dark / automatic (see skinMenu)

/* ---------- data ---------- */
async function load() {

    DATA = await getData("map"); $("#msg").style.display = "none";

}
async function loadLive() {
  try {
    LIVE = await getData("live"); { if (DATA) { render(); gwCard(); if (sel && sel[0] === "#") { if (sel !== "#settings") special(sel.slice(1)); } else if (sel && byId[sel] && !formOpen()) panel(sel, true); } }
  } catch (e) {}
}

const rtFresh = () => RT && Date.now() / 1000 - RT.t < 30;

const pidOf = p => String(p.id ?? p.n);          // a port's identity (ifIndex); p.n is only the number shown
function portNum(lbl) { const m = /(\d+)/.exec(lbl || ""); return m ? +m[1] : 999; }
// the view: "physical" (switches and ports) or "l3" (Internet -> gateway -> one group per /24 subnet -> its devices)
let VIEW = store("nm-view");
const curView = () => VIEW || DISP.default_view || "physical";
function viewNodes() {
  if (curView() !== "l3") return DATA.nodes;
  const gw = DATA.nodes.find(n => n.kind === "router"), out = [], nets = {};
  DATA.nodes.forEach(n => {
    if (n.kind === "inet" || n.kind === "router") { out.push(n); return; }
    if (n.kind === "group") return;                    // port groups and Wi-Fi mean nothing in this view
    const ip = n.ip || ((n.details || []).find(d => d[0] === "IP") || [])[1] || "";
    const m = /^(\d+\.\d+\.\d+)\.\d+$/.exec(ip), key = m ? m[1] + ".0/24" : "no address", id = "sn-" + key;
    if (!nets[id]) nets[id] = { id, parent: gw ? gw.id : "inet", name: key, sub: "", icon: m ? "network" : "help-circle", kind: "group",
                               status: "up", flags: [], details: [["Subnet", key]], port: "", n: 0 };
    nets[id].n++;

}
function index() {
  byId = {}; kids = {};

  NODES.forEach(n => { if (n.parent && byId[n.parent]) (kids[n.parent] = kids[n.parent] || []).push(n.id); });
  const rank = n => n.kind === "switch" ? 3 : n.kind === "group" ? (n.id === "wifi" ? 0 : 2) : 1;
  Object.values(kids).forEach(a => a.sort((x, y) => {
    const a1 = byId[x], b1 = byId[y];
    return (a1.id === "wifi" ? -1 : 0) - (b1.id === "wifi" ? -1 : 0) || rank(a1) - rank(b1) || portNum(a1.port) - portNum(b1.port) || a1.name.localeCompare(b1.name);
  }));

  $("#s-off").innerHTML = `<i class="dot" style="background:var(--off)"></i>${all.length - on} offline`;
  const nw = all.filter(n => n.flags.includes("new") || n.flags.includes("unknown")).length;

}
function status(n) { return (LIVE.nodes && LIVE.nodes[n.id]) || n.status; }
function portLive(ref) {
  if (!ref) return null;
  const a = LIVE.ports && LIVE.ports[ref[0]] ? LIVE.ports[ref[0]][String(ref[1])] : null;
  const b = rtFresh() && RT.ports[ref[0]] ? RT.ports[ref[0]][String(ref[1])] : null;
  return b ? Object.assign({}, a || {}, b) : a;
}
function portHist(ref) {
  if (!ref) return null;
  if (rtFresh() && RT.hist.ports[ref[0]] && RT.hist.ports[ref[0]][String(ref[1])]) return { rows: RT.hist.ports[ref[0]][String(ref[1])], live: true };
  const h = LIVE.hist && LIVE.hist.ports && LIVE.hist.ports[ref[0]] ? LIVE.hist.ports[ref[0]][String(ref[1])] : null;

}
function isFolded(id) { return id in folded ? folded[id] : (!!byId[id].collapsed || (kids[id] || []).length > 8); }

  if (DISP.units === "percent" && cap) return ((b || 0) / cap * 100).toFixed((b || 0) / cap < .1 ? 1 : 0) + " %";
  if (DISP.units === "bytes") { const m = (b || 0) / 8e6; return m >= 1000 ? (m / 1000).toFixed(2) + " GB/s" : m >= 10 ? m.toFixed(0) + " MB/s" : m >= 0.01 ? m.toFixed(2) + " MB/s" : "0 MB/s"; }

const SEV = [["Not classified", "#97AAB3"], ["Information", "#7499FF"], ["Warning", "#FFC859"], ["Average", "#FFA059"], ["High", "#E97659"], ["Disaster", "#E45959"]];

  issues(n).forEach(i => out.push(`<span class="tag t-${i.k}">${i.k === "cable" ? "cable?" : i.k === "traffic" ? "traffic" : "IP conflict"}</span>`));

  (n.flags || []).forEach(f => {
    if (f === "new") out.push('<span class="tag t-new">new</span>');
    else if (f === "unknown") out.push('<span class="tag t-unknown">unknown</span>');
    else if (f === "stale") out.push('<span class="tag t-stale" title="Not seen for days">stale</span>');

function iconHtml(n) {

  return n.logo ? `<img src="${esc(n.logo)}" alt="" draggable="false">` : `<i class="ti ti-${esc(n.icon || "help-circle")}" aria-hidden="true"></i>`; }

/* ---------- small graphs ---------- */
function spark(rows, a, b, max) {
  if (!rows || rows.length < 3) return '<div class="srow"><span>Graph builds up over the next few minutes.</span></div>';
  const Wd = 300, H = 46, vals = rows.flatMap(r => [r[a] || 0, b != null ? r[b] || 0 : 0]);
  const mx = max || Math.max(...vals, 1);

  const path = p => p.map((q, k) => (k ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");

function ago(ts) { if (!ts) return ""; const s = Date.now() / 1000 - ts; return s < 10 ? "just now" : s < 60 ? Math.round(s) + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; }

/* ---------- gateway card ---------- */
let gwMin = store("nm-gwmin"); if (gwMin === null) gwMin = false;

}
function gwCard() {

  const live = rtFresh();

  if (hoverId) highlight(hoverId);
  foldIcon();
  if (DASH) renderDash();

}

function highlight(id) {

function clampView() {                                  // keep part of the map on the screen: it can never get lost

  const avail = c.clientWidth - ($("#panel").classList.contains("open") && c.clientWidth > 700 ? 390 : 0);
  const lp = c.clientWidth > 700 && $("#gw").innerHTML ? 334 : 0;
  view.k = Math.max(.2, Math.min(1.15, (avail - lp - 40) / w, (c.clientHeight - 40) / h));
  view.x = lp + (avail - lp - w * view.k) / 2; view.y = ORIENT === "h" ? Math.max(20, (c.clientHeight - h * view.k) / 2) : 20; apply(anim);
}

function dbCard(icon, title, body, wide) { return `<section class="db-card${wide ? " db-wide" : ""}"><h3><i class="ti ti-${icon}"></i>${esc(title)}</h3>${body}</section>`; }

  const down = DATA.nodes.filter(n => status(n) === "down" && n.kind !== "inet");

  h += dbCard("world", "Internet", `<div class="db-big" style="color:${I.down_since ? "var(--bad)" : "var(--ok)"}">${I.down_since ? "Down" : upm != null ? upm.toFixed(upm >= 99.995 ? 2 : 3) + " %" : "-"}</div>`
    + `<div class="db-sub">${I.down_since ? "since " + ago(I.down_since) : "uptime this month" + (I.monitored != null && I.monitored < 99.5 ? ` · monitored ${I.monitored} %` : "")} · ${outs} outage${outs === 1 ? "" : "s"}</div>`

function invCsv(head, list) {

/* the spiderweb: drawn here, our own, nothing borrowed. Radials from the corner, and a spiral of curved threads. */
function webSvg() {
  const cx = 0, cy = 170, R = 165, spokes = 7, rings = 6, pts = [];
  for (let i = 0; i <= spokes; i++) { const a = -Math.PI / 2 + (Math.PI / 2) * i / spokes; pts.push([Math.cos(a), Math.sin(a)]); }
  let p = pts.map(([x, y]) => `<line class="silk" x1="${cx}" y1="${cy}" x2="${(cx + x * R).toFixed(1)}" y2="${(cy + y * R).toFixed(1)}"/>`).join("");
  for (let r = 1; r <= rings; r++) {
    const rr = R * r / (rings + .4);
    let d = "";
    pts.forEach(([x, y], i) => {
      const X = cx + x * rr, Y = cy + y * rr;
      if (!i) { d += `M${X.toFixed(1)} ${Y.toFixed(1)}`; return; }
      const [px, py] = pts[i - 1], mx = cx + (px + x) / 2 * rr * .9, my = cy + (py + y) / 2 * rr * .9;   // threads sag a little
      d += ` Q${mx.toFixed(1)} ${my.toFixed(1)} ${X.toFixed(1)} ${Y.toFixed(1)}`;
    });
    p += `<path class="silk" d="${d}"/>`;
  }
  // a small spider on a thread: hover over it and it drops down, then climbs back
  const spider = `<g class="spider" aria-hidden="true"><g transform="translate(70 74)" fill="var(--text)" stroke="var(--text)" stroke-width="1.2" stroke-linecap="round">
      <ellipse cx="0" cy="0" rx="4.2" ry="5.2"/><circle cx="0" cy="-6.4" r="2.6"/>
      <path fill="none" d="M-3 -2 L-9 -7 L-12 -3 M-3 0 L-10 -1 L-13 3 M-3 2 L-9 5 L-11 10 M-2.5 4 L-7 9 L-8 14 M3 -2 L9 -7 L12 -3 M3 0 L10 -1 L13 3 M3 2 L9 5 L11 10 M2.5 4 L7 9 L8 14"/></g></g>`;
  return `<svg viewBox="0 0 170 170" width="170" height="170" aria-hidden="true">${p}<line class="thread" x1="70" y1="30" x2="70" y2="68"/>${spider}</svg>`;
}
(() => {
  const w = document.createElement("div"); w.id = "web"; w.innerHTML = webSvg(); $("#canvas").appendChild(w);
  // the spider and its thread move together, frame by frame: down, a pause, back up (still if motion is reduced)
  const sp = w.querySelector(".spider"), th = w.querySelector(".thread"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let busy = false;
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const move = (from, to, ms) => new Promise(res => {
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / ms), y = from + (to - from) * ease(k);
      sp.setAttribute("transform", `translate(0 ${y.toFixed(1)})`); th.setAttribute("y2", (68 + y).toFixed(1));
      if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
  const drop = async () => { if (busy || still) return; busy = true; await move(0, 46, 1100); await new Promise(r => setTimeout(r, 1300)); await move(46, 0, 1600); busy = false; };
  sp.addEventListener("pointerenter", drop); sp.addEventListener("click", drop);
  const d = new Date(); if (d.getMonth() === 9 && d.getDate() === 31) document.documentElement.classList.add("halloween");   // 31 October
})();

      + `<div style="margin-top:8px"><span class="spd"><i style="background:var(--warn)"></i>10/100 Mbps</span><span class="spd"><i style="background:var(--ok)"></i>1 Gbps</span><span class="spd"><i style="background:var(--accent)"></i>2.5 Gbps</span><span class="spd"><i style="background:var(--pur)"></i>10 Gbps</span></div>`;
    h += `<div class="sec">Port clients</div><table class="lst"><tr class="h"><td>Port</td><td>Client</td><td>Speed</td><td>Traffic</td></tr>${sw.ports.filter(p => st(p) === "up" || p.clients.length).map(p => {
      const l = live[pidOf(p)];
      return `<tr class="${selPort === pidOf(p) ? "on" : ""}" data-pr="${esc(pidOf(p))}"><td>${esc(p.label)}${portVlanTxt(p, sw)}</td><td>${esc(p.clients.join(", ") || (p.alias || "—"))}${ci(p) ? `<div style="color:var(--warn);font-size:11px">cable? ${esc(ci(p).join("; "))}</div>` : ""}</td><td>${esc(p.speed || (st(p) === "up" ? "" : "down"))}</td><td style="white-space:nowrap">${l ? "↓" + mbps(l.tx, (p.speed_mbps || 0) * 1e6) + " ↑" + mbps(l.rx, (p.speed_mbps || 0) * 1e6) : ""}</td></tr>`;
    }).join("")}</table>`;
  }
  if (kids[id] && kids[id].length) h += `<div class="sec">${n.kind === "switch" ? "Connected" : "Clients"} · ${kids[id].length}</div>` + rowsTable(kids[id]);
  if (n.details && n.details.length) h += `<div class="sec">Details</div><table class="kv">${n.details.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`;
  P.innerHTML = h; P.classList.add("open"); document.body.classList.add("panel-open");
  $("#pclose").onclick = closePanel;
  wirePlace(n);
  const lkb = $("#lk-box"); if (lkb) lkb.onclick = e => { const b = e.target.closest("[data-lk]"); if (b) linkSend({ a: n.link_ends[0], b: n.link_ends[1], state: b.dataset.lk }); };
  $("#panel").querySelectorAll("[data-sg]").forEach(b => b.onclick = () => {
    const mine = (RT.suggestions || []).filter(x => x.a[0] === n.name || x.b[0] === n.name), x = mine[+b.dataset.sg];
    if (x) linkSend({ a: x.a, b: x.b, state: b.dataset.st });
  });
  const ap = $("#approve");
  if (ap) ap.onclick = async () => {
    ap.disabled = true;
    const r = await postApi({ mac: n.mac, approved: true }); const j = await r.json().catch(() => ({}));
    if (!j.ok) { ap.disabled = false; return toast(j.error || "Refused."); }
    n.flags = n.flags.filter(f => f !== "new" && f !== "unknown"); render(); panel(n.id, true);
    toast("Approved. It stays so after the next scan.");
  };
  const cm = $("#cmac"); if (cm) cm.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(n.mac); cm.innerHTML = '<i class="ti ti-check"></i>Copied'; };
  P.querySelectorAll("[data-go]").forEach(r => r.onclick = () => select(r.dataset.go, true));
  const isp = $("#inet-speed"); if (isp) isp.onclick = () => special("speed");
  const eb = $("#edit"); if (eb) eb.onclick = () => { const f = $("#ef"); f.style.display = f.style.display === "block" ? "none" : "block"; if (f.style.display === "block") $("#e-name").focus(); };
  const es = $("#e-save"); if (es) es.onclick = () => saveEdit(n);
  const ec = $("#e-cancel"); if (ec) ec.onclick = () => { $("#ef").style.display = "none"; };
  P.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { selPort = b.dataset.p; panel(id, true); });
}

/* ---------- presence ---------- */
let PRES = null;
async function loadPresence() { try { PRES = await getData("presence"); } catch (e) {} }
function presBar(mac, from, to) {
  const iv = (PRES && PRES.devices[mac]) || [], span = to - from;
  const rects = iv.filter(x => x[1] + 150 >= from && x[0] - 150 <= to).map(x => {
    const a = Math.max(from, x[0] - 150), b = Math.min(to, x[1] + 150);
    return `<rect x="${((a - from) / span * 100).toFixed(2)}%" y="0" width="${Math.max(.3, (b - a) / span * 100).toFixed(2)}%" height="10" fill="var(--ok)"/>`;
  }).join("");
  return `<svg class="pres"><rect width="100%" height="10" fill="var(--bg)"/>${rects}</svg>`;
}
function presenceHtml(mac) {
  if (!PRES || !PRES.devices[mac]) return "";
  const t = Date.now() / 1000, d0 = new Date(); d0.setHours(0, 0, 0, 0);
  let h = `<div class="sec">Online · last 24 h</div>${presBar(mac, t - 86400, t)}<div class="ticks" style="margin-left:0"><span>-24h</span><span>-18h</span><span>-12h</span><span>-6h</span><span>now</span></div>`;
  h += `<div class="sec">Last 7 days</div>`;
  for (let i = 0; i < 7; i++) {
    const s = d0.getTime() / 1000 - i * 86400, day = new Date(s * 1000).toLocaleDateString(undefined, { weekday: "short" });
    h += `<div class="prow"><span>${i ? esc(day) : "Today"}</span>${presBar(mac, s, s + 86400)}</div>`;
  }
  return h + `<div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;
}

/* ---------- activity feed ---------- */
let EVENTS = [], evFilter = "all";
const EVI = { device: "devices", security: "shield", ip: "network", internet: "world", port: "plug-connected", cable: "plug-x", traffic: "activity", speedtest: "gauge", audit: "user-edit" };
const SEVC = { info: "var(--muted)", ok: "var(--ok)", warn: "var(--warn)", bad: "var(--bad)" };
const EVF = { all: () => true, warnings: e => e.sev === "warn" || e.sev === "bad", devices: e => ["device", "security", "ip"].includes(e.type), internet: e => ["internet", "speedtest"].includes(e.type), ports: e => ["port", "cable", "traffic"].includes(e.type), changes: e => e.type === "audit" };
async function loadEvents() {
  try { { EVENTS = await getData("events"); actBadge(); if (sel === "#activity") special("activity"); } } catch (e) {}
}
function actBadge() {
  const seen = +(store("nm-seen") || 0), n = EVENTS.filter(e => e.t > seen && (e.sev === "warn" || e.sev === "bad")).length, b = $("#act-bd");
  b.textContent = n > 99 ? "99+" : n; b.style.display = n ? "" : "none";
}
function activityHtml() {
  const list = EVENTS.filter(EVF[evFilter]).slice().reverse().slice(0, 300);
  let h = `<div class="chips">${Object.keys(EVF).map(k => `<span class="chip ${evFilter === k ? "on" : ""}" data-f="${k}">${k[0].toUpperCase() + k.slice(1)}</span>`).join("")}</div>`;
  if (!list.length) return h + `<p style="color:var(--muted)">Nothing here yet. Events appear as things happen on your network.</p>`;
  let day = "";
  const today = new Date().toDateString(), yest = new Date(Date.now() - 86400000).toDateString();
  list.forEach(e => {
    const d = new Date(e.t * 1000), ds = d.toDateString();
    if (ds !== day) { day = ds; h += `<div class="evd">${ds === today ? "Today" : ds === yest ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" })}</div>`; }
    h += `<div class="evr ${e.node && byId[e.node] ? "go" : ""}" ${e.node && byId[e.node] ? `data-go="${esc(e.node)}"` : ""}><i class="ti ti-${EVI[e.type] || "point"}" style="color:${SEVC[e.sev] || "var(--muted)"}"></i><span class="tx">${esc(e.text)}</span><span class="tm">${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></div>`;
  });
  return h;
}

/* ---------- who's online ---------- */
let pplAll = false;
function peopleHtml() {
  const t = Date.now() / 1000;
  const devs = DATA.nodes.filter(n => n.mac && (pplAll || ["phone", "laptop"].includes(n.type))).sort((a, b) => (status(b) === "up") - (status(a) === "up") || a.name.localeCompare(b.name));
  let h = `<div class="chips"><span class="chip ${pplAll ? "" : "on"}" data-pa="0">Phones &amp; laptops</span><span class="chip ${pplAll ? "on" : ""}" data-pa="1">All devices</span></div>`;
  if (!devs.length) return h + `<p style="color:var(--muted)">No ${pplAll ? "" : "phones or laptops "}found yet. Set a device's type with Edit.</p>`;
  devs.forEach(n => {
    const on = status(n) === "up", iv = PRES && PRES.devices[n.mac], last = iv && iv.length ? iv[iv.length - 1] : null;
    const txt = on ? (last ? "online since " + new Date(last[0] * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "online") : (n.last ? "last seen " + ago(n.last) : "not seen");
    h += `<div class="pp" data-go="${esc(n.id)}"><div class="top"><span><i class="dot" style="background:${on ? "var(--ok)" : "var(--off)"};margin-right:6px"></i>${esc(n.name)}</span><span style="color:var(--muted);font-size:12px">${esc(txt)}</span></div>${presBar(n.mac, t - 86400, t)}</div>`;
  });
  return h + `<div class="ticks" style="margin-left:0"><span>-24h</span><span>-12h</span><span>now</span></div><p style="font-size:11px;color:var(--muted)">Phones sleep their Wi-Fi to save battery, so short gaps are normal.</p>`;
}

/* ---------- top talkers ---------- */
let topPer = "d";
function topHtml() {
  const U = rtFresh() && RT.usage ? RT.usage : null;
  let h = `<div class="chips"><span class="chip ${topPer === "d" ? "on" : ""}" data-tp="d">Today</span><span class="chip ${topPer === "m" ? "on" : ""}" data-tp="m">This month</span></div>`;
  if (!U) return h + `<p style="color:var(--muted)">Needs the real-time service (spidermap-rt).</p>`;
  const rows = [];
  Object.entries(U[topPer] || {}).forEach(([sid, pp]) => Object.entries(pp).forEach(([n, v]) => {
    const sw = DATA.switches[sid]; if (!sw) return;
    const p = sw.ports.find(x => pidOf(x) === n); if (!p) return;
    const node = DATA.nodes.find(x => x.port_ref && x.port_ref[0] === sid && String(x.port_ref[1]) === n && x.kind !== "switch");
    const up = p.clients.some(c => Object.values(DATA.switches).some(s2 => s2.name === c));
    rows.push({ name: p.clients.join(", ") || p.label, where: sw.name + " · " + p.label + (up ? " · uplink" : ""), sent: v[0], recv: v[1], tot: v[0] + v[1], node: node && node.id });
  }));
  rows.sort((a, b) => b.tot - a.tot);
  const mx = rows.length ? rows[0].tot : 1;
  rows.slice(0, 20).forEach(r => {
    h += `<div class="ttr" ${r.node ? `data-go="${esc(r.node)}"` : ""}><div class="top"><span>${esc(r.name)}<div style="font-size:11px;color:var(--muted)">${esc(r.where)}</div></span><span style="text-align:right;white-space:nowrap">${bytes(r.tot)}<div style="font-size:11px;color:var(--muted)">↑ ${bytes(r.sent)} · ↓ ${bytes(r.recv)}</div></span></div><div class="bb" style="width:${(r.tot / mx * 100).toFixed(1)}%"></div></div>`;
  });
  const since = U.since ? ` Counting since ${new Date(U.since * 1000).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}.` : "";
  return h + `<p style="font-size:11px;color:var(--muted)">Measured on the switch ports. Wi-Fi devices are counted together on the gateway's port. ↑ = sent by the device.${since}</p>`;
}

/* ---------- internet details ---------- */
function spHist(SP) {   // once the accurate Ookla engine is in use, hide older results from other tools
  const H = (SP && SP.history) || [];
  return H.some(x => x.engine === "Ookla") ? H.filter(x => x.engine === "Ookla") : H;
}
function speedBars(H) {
  const mx = Math.max(...H.map(x => Math.max(x.down, x.up)), 1);
  return `<div style="display:flex;align-items:flex-end;gap:6px;height:110px;margin:8px 0 2px">${H.map(x => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${new Date(x.at * 1000).toLocaleString()} · ${esc(x.server || "")}">
      <span style="font-size:10px;color:var(--muted)">${(x.down / 1e6).toFixed(0)}</span>
      <div style="display:flex;gap:2px;align-items:flex-end;height:82px;width:100%;justify-content:center">
        <div style="width:42%;height:${(x.down / mx * 100).toFixed(1)}%;background:var(--accent);border-radius:3px 3px 0 0"></div>
        <div style="width:42%;height:${(x.up / mx * 100).toFixed(1)}%;background:var(--pur);border-radius:3px 3px 0 0"></div>
      </div>
      <span style="font-size:10px;color:var(--faint);margin-top:3px">${new Date(x.at * 1000).toLocaleDateString(undefined, { day: "numeric", month: "numeric" })}</span>
    </div>`).join("")}</div>`;
}
function internetHtml() {
  if (!rtFresh() || !RT.inet) return "";
  const I = RT.inet, T = RT.targets || {};
  let h = `<div class="sec">Internet health</div>`;
  if (I.uptime_month != null) h += `<div class="srow" style="margin-bottom:4px"><span>Uptime this month</span><span>${I.uptime_month.toFixed(I.uptime_month >= 99.995 ? 2 : 3)} %</span></div>`;
  if (I.monitored != null) h += `<div class="srow" style="margin-bottom:4px" title="Time when SpiderMap was not running (restart, server off) counts neither as up nor as down."><span>Monitored</span><span class="${I.monitored < 95 ? "warnc" : ""}">${I.monitored} % of the month</span></div>`;
  Object.entries(T).forEach(([k, v]) => { h += `<div class="srow" style="margin-bottom:4px"><span>${esc(k)}</span><span>${v.ms == null ? '<span style="color:var(--bad)">no answer</span>' : v.ms + " ms · loss " + v.loss + " % · jitter " + (v.jit ?? "-") + " ms"}</span></div>`; });
  const L = RT.hist.lat || [];
  if (L.length > 2) h += `<div class="lgd" style="margin-top:8px"><span><i style="background:var(--accent)"></i>latency</span><span><i style="background:var(--pur)"></i>jitter</span><span style="margin-left:auto">last ${Math.round(L.length / 4)} min</span></div>` + spark(L, 1, 3);
  const outs = (I.outages_month || []).slice().reverse();
  h += `<div class="sec">Outages this month · ${outs.length}</div>`;
  h += outs.length ? `<table class="lst">${outs.map(o => `<tr><td>${new Date(o[0] * 1000).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</td><td>${Math.max(1, Math.round((o[1] - o[0]) / 60))} min</td></tr>`).join("")}</table>` : `<p style="color:var(--muted);margin:0">None.</p>`;
  const SH = spHist(RT.speedtest).slice(-10);
  if (SH.length) h += `<div class="gr" id="inet-speed" style="cursor:pointer;color:var(--accent);margin-top:12px"><span>Speed tests · last ${SH.length}</span><span>›</span></div>`;
  const ph = DATA.public_ip_history || [];
  if (ph.length) h += `<div class="sec">Public IP changes</div><table class="lst">${ph.slice().reverse().map(x => `<tr><td>${new Date(x[0] * 1000).toLocaleDateString()}</td><td>${esc(x[1])} → ${esc(x[2])}</td></tr>`).join("")}</table>`;
  return h;
}

/* ---------- special panels (activity, people, top talkers) ---------- */
const SPECIAL = { activity: ["Activity", "bell", activityHtml], people: ["Who's online", "users", peopleHtml], top: ["Top talkers", "chart-bar", topHtml],

/* ---------- speed test + CSV + toast ---------- */
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), 3500); }
async function startSpeedtest(msg) {
  const say = (t, bad) => { if (msg) { msg.style.color = bad ? "var(--bad)" : "var(--muted)"; msg.textContent = t; } else toast(t); };
  if (!ME.can.speedtest) return say(denied("speedtest"), true);
  if (RT && RT.speedtest && RT.speedtest.running) return say("A speed test is already running.");
  say("Starting speed test…");
  try {
    const r = await postApi({ action: "speedtest" });
    const j = await r.json().catch(() => ({ ok: false, error: "Unexpected answer (" + r.status + ")" }));
    if (!j.ok) return say(j.error || "Couldn't start the test.", true);
    if (RT && RT.speedtest) { RT.speedtest.running = true; RT.speedtest.started = Date.now() / 1000; RT.speedtest.error = ""; }
    gwCard(); if (sel === "#speed") special("speed");
    say("Speed test started. The result appears here in about 30 s.");
  } catch (e) { say("Couldn't reach the server.", true); }
}
$("#b-spd").onclick = () => special("speed");
$("#b-csv").onclick = () => {
  if (!DATA) return;
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const ts = x => x ? new Date(x * 1000).toLocaleString() : "";
  const rows = [["Name", "Type", "Status", "IP", "MAC", "Manufacturer", "Connection", "First seen", "Last seen", "Important", "Web UI"]];
  DATA.nodes.filter(n => n.mac).sort((a, b) => a.name.localeCompare(b.name)).forEach(n => rows.push([n.name, n.type, status(n), n.ip, n.mac, n.vendor, n.conn, ts(n.first), ts(n.last), (n.flags || []).includes("important") ? "yes" : "", n.url]));
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "network-devices-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); toast("Device list exported.");
};

/* ---------- search ---------- */
function matches(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  return DATA.nodes.filter(n => [n.name, n.ip, n.mac, n.sub].some(v => (v || "").toLowerCase().includes(q))).map(n => n.id);
}

});
